# Memento's extras service, in its own Docker Compose project in /opt/memento-extras:
# build/  the source (memento-extras/ from this repo)
# data/  edit results waiting to be saved, and the database
# memento-extras.env  settings + Gemini key (root-only)
# docker-compose.yml  one container, joined to Immich's network

- name: Create the service's folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [memento_extras_dir] + ([] if memento_extras_release else
       [memento_extras_dir ~ '/build', memento_extras_dir ~ '/build/creations/src']) }}

- name: Create the data folder, owned by the container's user
  ansible.builtin.file:
    path: "{{ memento_extras_dir }}/data"
    state: directory
    owner: "{{ memento_extras_uid }}"
    group: "{{ memento_extras_uid }}"
    mode: u=rwX,g=,o=
    recurse: true

- name: Build the service's image from this checkout
  when: memento_extras_release | length == 0
  block:
    - name: Copy the source to the VM
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../memento-extras/{{ item }}"
        dest: "{{ memento_extras_dir }}/build/{{ item }}"
        mode: "0644"
        directory_mode: "0755"
      loop:
        - Dockerfile
        - package.json
        - src/
        - creations/src/job.ts # the creations container's jobs and limits, which the service shares
      register: memento_extras_copied

    - name: List the source files in the repo
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../memento-extras/src"
        recurse: true
      delegate_to: localhost
      become: false
      register: memento_extras_src_repo

    - name: List the source files on the VM
      ansible.builtin.find:
        paths: "{{ memento_extras_dir }}/build/src"
        recurse: true
      register: memento_extras_src_vm

    - name: Work out which source files on the VM are no longer in the repo
      ansible.builtin.set_fact:
        memento_extras_stale: >-
          {{ memento_extras_src_vm.files | map(attribute='path')
             | map('relpath', memento_extras_dir ~ '/build/src')
             | difference(memento_extras_src_repo.files | map(attribute='path')
                          | map('relpath', playbook_dir ~ '/../memento-extras/src'))
             | list }}

    - name: Check that most of the VM's source stays
      ansible.builtin.assert:
        that:
          - memento_extras_src_repo.files | length > 0
          - memento_extras_stale | length < memento_extras_src_vm.files | length
          - "'server.ts' not in memento_extras_stale"
        fail_msg: "Would remove {{ memento_extras_stale | length }} of {{ memento_extras_src_vm.files | length }} source files on the VM; stopping."
        quiet: true

    - name: Remove source files that are no longer in the repo
      ansible.builtin.file:
        path: "{{ memento_extras_dir }}/build/src/{{ item }}"
        state: absent
      loop: "{{ memento_extras_stale }}"
      register: memento_extras_removed

    - name: Build the memento-extras image
      community.docker.docker_image:
        name: memento-extras
        tag: local
        source: build
        build:
          path: "{{ memento_extras_dir }}/build"
        force_source: "{{ memento_extras_copied is changed or memento_extras_removed is changed }}"
      register: memento_extras_image

- name: Pull Memento's images for the release
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop:
    - "{{ memento_extras_image_ref }}"
    - "{{ memento_extras_reader_image_ref }}"
    - "{{ memento_extras_creations_image_ref }}"
  register: memento_extras_pulled
  when: memento_extras_release | length > 0

- name: The question reader (Ask)
  ansible.builtin.import_tasks: reader.yml
  when: memento_extras_release | length == 0

- name: Collages, recap videos, animations and cinematic photos (the creations container)
  ansible.builtin.import_tasks: creations.yml

- name: Write memento-extras.env (settings + Gemini key)
  ansible.builtin.template:
    src: memento-extras.env.j2
    dest: "{{ memento_extras_dir }}/memento-extras.env"
    mode: "0600"
  diff: false
  register: memento_extras_env

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ memento_extras_dir }}/docker-compose.yml"
    mode: "0644"
  register: memento_extras_compose

- name: Start the service (docker compose up)
  community.docker.docker_compose_v2:
    project_src: "{{ memento_extras_dir }}"
    state: present
    pull: never
    remove_orphans: true
    recreate: >-
      {{ 'always' if (memento_extras_image is changed or memento_extras_reader_image is changed
         or memento_extras_creations_image is changed or memento_extras_pulled is changed
         or memento_extras_env is changed or memento_extras_compose is changed) else 'auto' }}
    wait: true
    wait_timeout: 120

- name: Night captions for new photos
  ansible.builtin.import_tasks: caption-night.yml

# A release keeps its images and the previous release's (for going back), listed in releases;
# other tags of the four images are removed.
- name: Remove older releases' images
  when: memento_extras_release | length > 0
  block:
    - name: Read the releases kept so far
      ansible.builtin.slurp:
        src: "{{ memento_extras_dir }}/releases"
      register: memento_extras_releases_file
      failed_when: false

    - name: Keep this release and the one before
      ansible.builtin.set_fact:
        memento_extras_keep: >-
          {{ (([memento_extras_release] + (memento_extras_releases_file.content | default('') | b64decode).split())
              | unique | list)[:2] }}

    - name: Write down the releases kept
      ansible.builtin.copy:
        content: "{{ memento_extras_keep | join('\n') }}\n"
        dest: "{{ memento_extras_dir }}/releases"
        mode: "0644"

    - name: List the release images on the server
      community.docker.docker_host_info:
        images: true
        images_filters:
          reference: "{{ memento_extras_images }}/memento-*"
      register: memento_extras_release_images

    - name: Remove the other releases' images
      community.docker.docker_image:
        name: "{{ item }}"
        state: absent
      loop: >-
        {{ memento_extras_release_images.images | map(attribute='RepoTags') | flatten
           | select('match', (memento_extras_images | regex_escape) ~ '/memento-(server|extras|reader|creations):')
           | reject('match', '.*:(' ~ (memento_extras_keep | map('regex_escape') | join('|')) ~ ')$')
           | list }}
