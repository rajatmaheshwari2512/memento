# Written to /etc/docker/daemon.json: at most 3 log files of 10 MB per container.
docker_daemon_config:
  # Containers keep running while Docker restarts or updates.
  live-restore: true
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"

# Automatic updates install Docker's new releases, within these major versions (docs/upgrades.md).
docker_major_versions:
  docker-ce: "5:29"
  docker-ce-cli: "5:29"
  docker-ce-rootless-extras: "5:29"
  containerd.io: "2"
  docker-buildx-plugin: "0"
  docker-compose-plugin: "5"
