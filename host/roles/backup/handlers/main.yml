# Picks up a changed schedule. Doesn't start a backup.
- name: Restart the backup timer
  ansible.builtin.systemd_service:
    name: deep-archive-backup.timer
    state: restarted
    daemon_reload: true
  # A --check preview doesn't really install the timer, so systemd can't find it yet.
  ignore_errors: "{{ ansible_check_mode }}"
