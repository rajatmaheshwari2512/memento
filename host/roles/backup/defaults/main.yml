# Set from .env in group_vars/all/main.yml. All three empty: no backups (a warning). Only some:
# the role stops with an error.
backup_bucket: ""
backup_access_key_id: ""
backup_secret_access_key: ""
backup_off: "{{ (backup_bucket ~ backup_access_key_id ~ backup_secret_access_key) | length == 0 }}"
backup_aws_region: us-east-1
backup_rclone_version: "1.76.0"
# The two encryption passwords (obscured).
backup_crypt_password_obscured: ""
backup_crypt_password2_obscured: ""

# What to copy: one entry per app folder, copied one after the other in the
# same nightly run. The full list is in group_vars/all/main.yml.
#   name:           a short label for the log
#   source:         a folder on the server's disk
#   encrypt_names:  base32 or base64. Files are encrypted on the way with backup_crypt_password*. Keep a folder's style once it has backups.
#   dest_path:      the folder in the bucket
# weekly_only:    optional: a subfolder (e.g. Immich's backups/) left out of the nightly copy; once a week (backup_weekly_day) only its newest file is copied, as weekly_as.
#   weekly_as:      the file name for that weekly copy (e.g. latest.sql.gz)
# skip_folders:   optional: subfolders never copied (e.g. Immich's encoded-video/).
# compare:        optional: size (the default, --size-only) or modtime (size and time).
backup_jobs:
  - name: immich
    source: /opt/immich/library
    dest_path: immich
    encrypt_names: base32

# Day of the week for weekly_only copies, as `date +%u` counts: 1 = Monday ... 7 = Sunday.
backup_weekly_day: 7

# systemd calendar format, in the server's timezone (set by the base role).
backup_schedule: "*-*-* 04:00:00"

# rclone's parallel transfers and checks, per copy (the copies run one after the other).
backup_transfers: 4
backup_checkers: 4
