# Nightly backups to AWS Glacier Deep Archive (backup.yml), when BACKUP_BUCKET_NAME is set in .env.

- name: Warn that there are no backups
  ansible.builtin.debug:
    msg: >-
      WARNING: no backups. BACKUP_BUCKET_NAME and the backup keys are empty in .env, so nothing is
      copied off this server: if its disk is lost, the photos are lost. To turn backups on, see
      BACKUPS in .env.example.
  when: backup_off | bool

- name: Nightly backup to Glacier Deep Archive
  ansible.builtin.import_tasks: backup.yml
  when: not backup_off | bool
