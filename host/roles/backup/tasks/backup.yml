# Nightly copy of the apps' files to AWS Glacier Deep Archive, as a systemd timer. One run copies each folder in backup_jobs in turn, with rclone, encrypted (see backup.sh.j2). Output: journalctl -u deep-archive-backup.

- name: Install rclone {{ backup_rclone_version }}
  ansible.builtin.apt:
    deb: https://downloads.rclone.org/v{{ v }}/rclone-v{{ v }}-linux-{{ arch }}.deb
  vars:
    v: "{{ backup_rclone_version }}"
    arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

- name: Check the backup settings are filled in
  ansible.builtin.assert:
    that:
      - backup_bucket | length > 0
      - backup_access_key_id | length > 0
      - backup_secret_access_key | length > 0
      - backup_jobs | length > 0
      - backup_crypt_password_obscured | length > 0
      - backup_crypt_password2_obscured | length > 0
    fail_msg: >-
      Fill in BACKUP_* in .env (see .env.example)
      (BACKUPS).
    quiet: true

- name: Create the backup folder (root only)
  ansible.builtin.file:
    path: /etc/deep-archive-backup
    state: directory
    mode: "0700"

# Defines the "glacier" remote (and the encrypting remotes over it) from environment variables, so no rclone.conf is needed.
- name: Write the Deep Archive login and encryption settings (env file)
  ansible.builtin.template:
    src: glacier.env.j2
    dest: /etc/deep-archive-backup/glacier.env
    mode: "0600"
  diff: false

- name: Install the backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /etc/deep-archive-backup/backup.sh
    mode: "0700"

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - deep-archive-backup.service
    - deep-archive-backup.timer
  notify: Restart the backup timer

- name: Turn the timer on now and at every boot
  ansible.builtin.systemd_service:
    name: deep-archive-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
