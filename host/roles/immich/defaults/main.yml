# Pinned Immich release, and its docker-compose.yml's sha256. To upgrade: docs/upgrades.md.
immich_version: v3.4.2
immich_compose_sha256: 1455e3f474687cb96ecb2eab23a0a7268ac5515b094022c66f3902ceb7f0a564

immich_dir: /opt/immich

# Originals, uploads, encoded videos, profile pictures, DB dumps.
immich_upload_location: /opt/immich/library
# Thumbnails and previews: on the VM's disk, so scrolling is fast.
immich_thumb_location: /opt/immich/thumbs
# Postgres: must be on local disk, never a network mount.
immich_db_data_location: /opt/immich/postgres

immich_timezone: Etc/UTC

# Set from .env (IMMICH_DB_PASSWORD). Letters and digits only (Immich's rule).
immich_db_password: ""

# Serve our own build of Immich's web app (made by apps/web/build.sh, e.g. .../apps/web/dist/v3.4.2) instead of the official one. Empty = the official web app.
immich_custom_web_dir: ""
# Where builds are unpacked on the VM, one folder per build.
immich_web_builds_dir: /opt/immich/web

# A Memento release (MEMENTO_VERSION in .env): Immich's server image with Memento's website in it, like ghcr.io/<owner>/memento-server:v1.2.0, run instead of Immich's own. Must be built on immich_version. Empty = Immich's own image.
immich_server_image: ""
