# Pinned Immich release. To upgrade (docs/runbooks.md):
#   1. read the release notes for breaking changes
#   2. change immich_version
#   3. put the new docker-compose.yml's sha256 in immich_compose_sha256:
#        curl -sL https://github.com/immich-app/immich/releases/download/<version>/docker-compose.yml | shasum -a 256
immich_version: v3.4.2
# v3.4.2's compose file is byte-identical to v3.4.1's, so the checksum is unchanged.
immich_compose_sha256: 1455e3f474687cb96ecb2eab23a0a7268ac5515b094022c66f3902ceb7f0a564

immich_dir: /opt/immich

# Originals, uploads, encoded videos, profile pictures, DB dumps.
immich_upload_location: /opt/immich/library
# true = refuse to start unless immich_upload_location is really a mount (e.g. a network disk).
immich_require_mount: false
# Thumbnails and previews: on the VM's disk, so scrolling is fast.
immich_thumb_location: /opt/immich/thumbs
# Postgres: must be on local disk, never a network mount.
immich_db_data_location: /opt/immich/postgres

immich_timezone: Etc/UTC

# Set from .env (IMMICH_DB_PASSWORD). Letters and digits only (Immich's rule).
immich_db_password: ""

# SelfPhotos phase 2: serve our own build of Immich's web app (with the AI Edit button)
# instead of the one inside the official image. A folder on your Mac made by
# apps/web/build.sh, e.g. .../apps/web/dist/v3.4.2. Empty = the official web app.
immich_custom_web_dir: ""
# Where builds are unpacked on the VM, one folder per build.
immich_web_builds_dir: /opt/immich/web
