# One block per website in the Caddyfile. Set in group_vars/all/main.yml.
#   hostname: the public name (needs a DNS record pointing at this VM)
#   upstream: where Caddy forwards requests (an app listening on localhost)
#   routes:   optional list checked first. Each has a prefix (matches /prefix and /prefix/...) and an upstream:
#             another app to forward to, with the prefix removed (e.g. /extras)
caddy_sites: []

# Ports opened in the VM's own firewall. Oracle's security list (Terraform) opens them too.
caddy_firewall_ports: [80, 443]
