# The whole VM setup. Run from this folder (host/):
#
#   ansible-playbook site.yml --check --diff    preview, changes nothing
#   ansible-playbook site.yml --diff            apply
#   ansible-playbook site.yml --tags caddy      run one role only

- name: Check .env
  hosts: photos
  gather_facts: false
  tags: always
  tasks:
    - name: Check .env is filled in
      ansible.builtin.assert:
        that: photos_hostname is search('\\.')
        fail_msg: "Copy .env.example to .env at the top of the repo and fill in the PROD lines (MEMENTO_DOMAIN is missing or has no dot)."
        quiet: true

    - name: Check where a release's images are
      ansible.builtin.assert:
        that: memento_version | length == 0 or memento_images | length > 0
        fail_msg: >-
          MEMENTO_VERSION is set but MEMENTO_IMAGES is empty: set it in .env (like ghcr.io/<owner>),
          or deploy with ./memento prod deploy, which works it out from the git remote.
        quiet: true

- name: Set up the SelfPhotos VM
  hosts: photos
  become: true # run tasks as root (sudo)

  roles:
    - role: base # timezone, security updates, swap
      tags: base
    - role: docker # Docker Engine + compose plugin
      tags: docker
    - role: caddy # HTTPS in front of Immich, firewall ports 80/443
      tags: caddy
    - role: immich # the app (Docker Compose)
      tags: immich
    - role: memento_extras # AI edits, feature flags, and more (needs Immich's network)
      tags: memento_extras
    - role: backup # rclone, and a nightly encrypted copy to Deep Archive (deep-archive-backup); a warning without BACKUP_* in .env
      tags: backup
