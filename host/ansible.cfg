[defaults]
inventory = inventory.yml
roles_path = roles
filter_plugins = filter_plugins
# Run queued handlers (like "Reload Caddy") even if a later task fails. Without this,
# a failed run can leave a changed config file on the server that was never loaded,
# and the next run won't notice, because the file already matches.
force_handlers = True

[ssh_connection]
# Faster: sends each task over the existing SSH connection instead of copying files.
pipelining = True
