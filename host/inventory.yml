# The one machine Ansible manages, over SSH.
all:
  hosts:
    photos:
      # SERVER_HOST in .env, else MEMENTO_DOMAIN.
      ansible_host: "{{ dotenv.SERVER_HOST | default(photos_hostname, true) }}"
      ansible_user: "{{ dotenv.SERVER_USER | default('ubuntu', true) }}"
      ansible_python_interpreter: /usr/bin/python3
      # A new server's SSH key is trusted on the first connection; a changed key still stops.
      ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
