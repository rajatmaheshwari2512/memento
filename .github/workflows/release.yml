# Builds a Memento release from each push to main that has a feat or fix since the last release,
# or by hand (Actions → Release → Run workflow, on main). Other pushes stop after the first job
# (queued behind a release that's still building).
# The version comes from the commit messages (Conventional Commits): fix: or perf: → 1.0.1,
# feat: → 1.1.0, feat!: or a BREAKING CHANGE: footer → 2.0.0. Each fork builds its own, into its own packages.
#
#   Images, for linux/amd64 and linux/arm64, at ghcr.io/<owner>/<name>:<version>:
#     memento-server     Immich's server image with Memento's website in it
#     memento-extras     Memento's service
#     memento-reader     Ask's reader, with its model
#     memento-creations  the creations container
#   A GitHub Release and tag v<version>: notes from the commits, the website (.tar.gz), the
#   Android app (.apk) and SHA256SUMS.
#
# Servers never follow it by themselves: ./memento prod update <version> (docs/upgrades.md).
# The app is signed with the "release" environment's ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEYSTORE_ALIAS; without them the release has no app.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      changes: ${{ steps.next.outputs.changes }}
      images: ${{ steps.read.outputs.images }}
      immich: ${{ steps.read.outputs.immich }}
      commit: ${{ steps.read.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the next version (go-semantic-release)
        id: next
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/semantic-release"
          curl -fsSL -o "$bin" https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64
          echo "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3  $bin" | sha256sum -c -
          chmod +x "$bin"
          "$bin" --no-ci --dry --allow-no-changes --version-file --changelog "$RUNNER_TEMP/changes.md" \
            --plugin-resolver github --ci-condition default@1.11.0 \
            --provider git@1.13.0 --provider-opt default_branch=main \
            --commit-analyzer default@1.15.0 --commit-analyzer-opt patch_release_rules=fix,perf \
            --changelog-generator default@1.15.0
          if [ ! -f .version-unreleased ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "### No release: no feat or fix since the last one" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          end="CHANGES_$(openssl rand -hex 8)"
          {
            echo "version=v$(cat .version-unreleased)"
            echo "changes<<$end"
            awk '/^#### /{keep = ($0 ~ /^#### (Breaking Changes|Feature|Bug Fixes|Reverts|Performance Improvements)$/)} keep' "$RUNNER_TEMP/changes.md"
            echo "$end"
          } >> "$GITHUB_OUTPUT"

      - name: Read the versions
        id: read
        if: steps.next.outputs.version != ''
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          immich=$(sed -n 's/^immich_version: *//p' host/roles/immich/defaults/main.yml)
          [ -n "$immich" ] || { echo "::error::No immich_version in host/roles/immich/defaults/main.yml"; exit 1; }
          {
            echo "images=ghcr.io/${OWNER,,}"
            echo "immich=$immich"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  website:
    name: Website
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the website (apps/web/build.sh)
        env:
          WEB_BUILD_DIR: ${{ runner.temp }}/web
          IMMICH: ${{ needs.prepare.outputs.immich }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          apps/web/build.sh
          mkdir -p "$RUNNER_TEMP/out"
          tar -C "$WEB_BUILD_DIR/$IMMICH" -czf "$RUNNER_TEMP/out/memento-website-$VERSION.tar.gz" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Image ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: memento-extras
            context: memento-extras
            description: Memento's service, next to Immich
          - name: memento-reader
            context: memento-extras/reader
            description: Memento's Ask reader, with its model
          - name: memento-creations
            context: memento-extras/creations
            description: Memento's creations container (collages, recaps, cinematic photos, Reduce noise)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Ask's reader model
        if: matrix.name == 'memento-reader'
        run: |
          defaults=host/roles/memento_extras/defaults/main.yml
          url=$(sed -n 's/^memento_extras_reader_url: *//p' "$defaults")
          revision=$(sed -n 's/^memento_extras_reader_revision: *//p' "$defaults")
          files=$(sed -n '/^memento_extras_reader_sha256:/,/^[^ ]/s/^  \([A-Za-z0-9._-]*\): *\([0-9a-f]\{64\}\) *$/\1:\2/p' "$defaults")
          mkdir -p memento-extras/reader/model
          for entry in $files; do
            python3 -I deploy/dev/fetch.py "$url/$revision/${entry%%:*}" "${entry#*:}" "memento-extras/reader/model/${entry%%:*}"
          done
          for file in config.json tokenizer.json model.onnx; do
            [ -f "memento-extras/reader/model/$file" ] || { echo "::error::No $file: check the reader's pin in $defaults"; exit 1; }
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.images }}/${{ matrix.name }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=${{ matrix.description }}

  server-image:
    name: Image memento-server
    needs: [prepare, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website

      - name: Unpack the website
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/server/www"
          tar -xzf "$RUNNER_TEMP/website/memento-website-$VERSION.tar.gz" -C "$RUNNER_TEMP/server/www"
          [ -f "$RUNNER_TEMP/server/www/index.html" ] || { echo "::error::The website has no index.html"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/server
          file: deploy/server/Dockerfile
          build-args: IMMICH_VERSION=${{ needs.prepare.outputs.immich }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.images }}/memento-server:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.description=Immich's server with Memento's website
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Immich's server with Memento's website

  android:
    name: Android app
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    outputs:
      built: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check the signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] && [ -n "$ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=No Android app in this release::The release environment's secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEYSTORE_ALIAS aren't all set."
          {
            echo "### No Android app in this release"
            echo
            echo "The app is signed with the \"release\" environment's secrets ANDROID_KEYSTORE_BASE64,"
            echo "ANDROID_KEYSTORE_PASSWORD and ANDROID_KEYSTORE_ALIAS, and they aren't all set. The rest of the"
            echo "release is published without it."
            echo "To add them: docs/setup-prod.md, \"Releases\"."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Make room on the disk
        if: steps.signing.outputs.ready == 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: ''

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: steps.signing.outputs.ready == 'true'
        with:
          version: 2026.10.5
          install: false
          cache: false

      - name: Install the build tools
        if: steps.signing.outputs.ready == 'true'
        working-directory: immich
        env:
          MISE_EXPERIMENTAL: 1
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd mobile && mise install aqua:flutter/flutter java rust)
          mise install node pnpm npm:@openapitools/openapi-generator-cli
          (cd native && mise install rust)
          version=$(python3 -I -c 'import json; print(json.load(open("open-api/openapitools.json"))["generator-cli"]["version"])')
          url="https://maven-central.storage-download.googleapis.com/maven2/org/openapitools/openapi-generator-cli/$version/openapi-generator-cli-$version.jar"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/generator.jar" "$url"
          echo "$(curl -fsSL --retry 5 --retry-all-errors "$url.sha1")  $RUNNER_TEMP/generator.jar" | sha1sum -c -
          dirs=$(find "$HOME/.local/share/mise/installs" -type d -path '*node_modules/@openapitools/openapi-generator-cli')
          [ -n "$dirs" ] || { echo "::error::openapi-generator-cli isn't installed"; exit 1; }
          for dir in $dirs; do mkdir -p "$dir/versions" && cp "$RUNNER_TEMP/generator.jar" "$dir/versions/$version.jar"; done

      - name: Build the app (apps/android/build.sh)
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/memento.jks"
          unset KEYSTORE
          printf 'ANDROID_KEYSTORE_PATH=%s\nANDROID_KEYSTORE_ALIAS=%s\nANDROID_KEYSTORE_PASSWORD=%s\n' \
            "$RUNNER_TEMP/memento.jks" "$ALIAS" "$PASSWORD" > "$RUNNER_TEMP/android.env"
          MEMENTO_ENV_FILE="$RUNNER_TEMP/android.env" apps/android/build.sh
          set -- apps/android/dist/memento-*.apk
          [ $# = 1 ] && [ -f "$1" ] || { echo "::error::Expected one APK in apps/android/dist"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$1" "$RUNNER_TEMP/out/memento-$VERSION.apk"

      - name: Remove the signing key
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/memento.jks" "$RUNNER_TEMP/android.env"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.ready == 'true'
        with:
          name: android
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [prepare, website, images, server-image, android]
    if: >-
      ${{ !cancelled() && needs.website.result == 'success' && needs.images.result == 'success'
      && needs.server-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-release.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{website,android}"
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Check anyone can pull the images
        env:
          IMAGES: ${{ needs.prepare.outputs.images }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if python3 -I scripts/check-release.py "$IMAGES" "$VERSION"; then exit 0; fi
          echo "::warning title=The images aren't public::A server can't pull them yet. Make each package public: github.com/$OWNER?tab=packages → the package → Package settings → Change visibility → Public."
          {
            echo "### The images aren't public yet"
            echo
            echo "A server pulls them without logging in. Make each of the four packages public, once:"
            echo "github.com/$OWNER?tab=packages → the package → Package settings → Change visibility → Public."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGES: ${{ needs.prepare.outputs.images }}
          IMMICH: ${{ needs.prepare.outputs.immich }}
          CHANGES: ${{ needs.prepare.outputs.changes }}
          APP: ${{ needs.android.result }}
          APP_SIGNED: ${{ needs.android.outputs.built }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          {
            echo "Memento $VERSION, on Immich $IMMICH."
            echo
            if [ "$APP" = success ] && [ "$APP_SIGNED" = true ]; then
              echo "**The Android app:** \`memento-$VERSION.apk\` below, for 64-bit ARM phones. It installs over an"
              echo "older Memento app signed with the same key."
            elif [ "$APP" = success ]; then
              echo "**No Android app in this release:** the release environment's signing secrets aren't set."
            else
              echo "**No Android app in this release:** its build didn't finish (the run's \"Android app\" job)."
            fi
            echo
            echo "**Server images**, for linux/amd64 and linux/arm64:"
            for name in memento-server memento-extras memento-reader memento-creations; do
              echo "- \`$IMAGES/$name:$VERSION\`"
            done
            echo
            echo "To run this release on your server: \`./memento prod update $VERSION\` (docs/upgrades.md)."
            echo "\`memento-website-$VERSION.tar.gz\` is the website on its own, the same files as in memento-server."
            echo
            printf '%s\n' "$CHANGES"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" ./* --clobber
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Memento $VERSION" --notes-file "$RUNNER_TEMP/notes.md" ./*
          fi
          {
            echo "### Memento $VERSION"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
